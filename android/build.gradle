// Versions: see docs/android.md. AGP 9 has built-in Kotlin, so there is no kotlin-android plugin here.
// The Kotlin Gradle plugin that AGP brings is raised to the same version as the Compose compiler plugin below.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin') {
            version {
                strictly('2.4.20')
            }
        }
    }
}

plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20' apply false
}
