plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'org.nomad.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.nomad.app'
        minSdk = 30
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    // The shared protocol modules are compiled straight into the app. The Android compiler then checks
    // every API they use against the Android SDK, which is exactly what we want to know.
    sourceSets {
        main {
            java.srcDir('../../core/src/main/java')
            java.srcDir('../../crypto/src/main/java')
            java.srcDir('../../client-core/src/main/java')
        }
    }

    packaging {
        resources {
            excludes.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
            excludes.add('META-INF/{AL2.0,LGPL2.1}')
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2026.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
