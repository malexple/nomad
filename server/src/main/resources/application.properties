server.port=8080
# WebSocket gateway (Netty)
nomad.ws.port=8090
# memory | postgres
nomad.store=memory
nomad.pg.url=jdbc:postgresql://localhost:5432/nomad
nomad.pg.user=nomad
nomad.pg.password=nomad
# local | redis
nomad.bus=local
nomad.redis.uri=redis://localhost:6379
# per-device limits
nomad.limits.send-per-sec=20
nomad.limits.send-burst=50
nomad.limits.read-per-sec=50
nomad.limits.read-burst=100
nomad.limits.pk-per-min=10
nomad.limits.pk-target-per-min=3
